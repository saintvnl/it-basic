    <section class="contact">
      <form class="contact-form" action="#" method="post">
        <label for="naam">rayan</label>
        <input type="text" id="naam" name="naam" placeholder="Jouw naam" required>

        <label for="email">346028@student.mboutrecht.nl</label>

        <button type="submit" class="btn">Verstuur</button>
      </form>

      <div class="contact-info">
        <h2>Contactgegevens</h2>
        <p><strong>E-mail:</strong> <a href="mailto:jouw@email.nl">jouw@email.nl</a></p>
